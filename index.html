
<!-- ==========================================
     BOT DO BM3 — ENTRADA ANIMADA
     HTML + CSS + JAVASCRIPT
========================================== -->

<!-- 1. CARREGAMENTO -->
<div id="loading">
    <img class="entry-logo"
         src="ChatGPT%20Image%204%20de%20out.%20de%202026%2C%2004_43_09.png"
         alt="Logo BOT DO BM3">

    <div class="entry-content">
        <div class="entry-clover">🍀</div>
        <h1>BOT DO BM3</h1>
        <p class="entry-subtitle">PREPARANDO TUDO PARA VOCÊ</p>

        <div class="entry-track">
            <div class="entry-progress"></div>
        </div>

        <p class="entry-status">CARREGANDO...</p>
    </div>
</div>

<!-- 2. BOAS-VINDAS -->
<div id="welcome">
    <img class="entry-logo welcome-logo"
         src="ChatGPT%20Image%204%20de%20out.%20de%202026%2C%2004_43_09.png"
         alt="Logo BOT DO BM3">

    <div class="welcome-content">
        <div class="entry-clover">🍀</div>
        <p class="welcome-small">SEJA BEM-VINDO(A)</p>
        <h1>AO <span>BOT DO BM3!</span></h1>
        <p class="welcome-description">
            Seu bot, sempre com você!
        </p>
        <div class="welcome-check">✓</div>
        <p class="welcome-finish">Tudo pronto para começar!</p>
    </div>
</div>

<style>
/* FUNDO PREMIUM */
#loading,
#welcome {
    position: fixed;
    inset: 0;
    z-index: 99999;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    color: white;
    background:
        radial-gradient(circle at center,
            rgba(0,255,100,.13), transparent 48%),
        linear-gradient(140deg, #020503, #07190d, #000);
    transition: opacity .7s ease, visibility .7s ease;
}

#loading {
    opacity: 1;
    visibility: visible;
}

#welcome {
    opacity: 0;
    visibility: hidden;
}

#welcome.show {
    opacity: 1;
    visibility: visible;
}

#welcome.hide {
    opacity: 0;
    visibility: hidden;
}

/* LOGO NO CANTO SUPERIOR ESQUERDO */
.entry-logo {
    position: absolute;
    top: 22px;
    left: 22px;
    width: 100px;
    height: 100px;
    object-fit: contain;
    border-radius: 20px;
    border: 2px solid #00ed70;
    background: #020503;
    box-shadow: 0 0 25px rgba(0,255,100,.3);
    animation: entryLogoIn .8s ease both;
}

.entry-content,
.welcome-content {
    width: min(88%, 480px);
    text-align: center;
    animation: entryContentIn .8s ease both;
}

.entry-clover {
    font-size: 58px;
    margin-bottom: 15px;
    filter: drop-shadow(0 0 14px #00ed7070);
}

.entry-content h1 {
    font-size: clamp(28px, 6vw, 42px);
    font-weight: 950;
    letter-spacing: 3px;
    color: #00ff72;
    text-shadow: 0 0 20px #00ff7230;
}

.entry-subtitle {
    margin-top: 12px;
    color: #c5d6ca;
    font-size: 12px;
    letter-spacing: 2px;
}

/* BARRA DE PROGRESSO */
.entry-track {
    width: 100%;
    height: 12px;
    padding: 2px;
    margin: 30px 0 18px;
    border: 1px solid #00ed70;
    border-radius: 20px;
    overflow: hidden;
}

.entry-progress {
    height: 100%;
    width: 0;
    border-radius: 20px;
    background: linear-gradient(90deg,
        #008c45, #00ff72, #c4ffd9);
    box-shadow: 0 0 12px #00ff72;
    animation: entryProgress 2.5s linear forwards;
}

.entry-status {
    color: #00ed70;
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 3px;
    animation: entryPulse 1.1s infinite;
}

/* BOAS-VINDAS */
.welcome-content {
    transform: translateY(25px) scale(.95);
    transition: transform .7s ease;
}

#welcome.show .welcome-content {
    transform: translateY(0) scale(1);
}

.welcome-small {
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 2px;
}

.welcome-content h1 {
    margin-top: 12px;
    font-size: clamp(27px, 6vw, 42px);
    font-weight: 950;
}

.welcome-content h1 span {
    color: #00ff72;
    display: block;
    margin-top: 5px;
    text-shadow: 0 0 20px #00ff7230;
}

.welcome-description {
    margin-top: 18px;
    color: #c5d6ca;
    font-size: 15px;
}

.welcome-check {
    width: 65px;
    height: 65px;
    margin: 28px auto 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid #00ff72;
    border-radius: 50%;
    color: #00ff72;
    font-size: 35px;
    box-shadow: 0 0 24px #00ff7230;
    animation: entryCheck .6s .2s ease both;
}

.welcome-finish {
    color: #00ff72;
    font-size: 15px;
}

/* ANIMAÇÕES */
@keyframes entryLogoIn {
    from { opacity: 0; transform: translateY(-15px) scale(.8); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes entryContentIn {
    from { opacity: 0; transform: translateY(18px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes entryProgress {
    from { width: 0; }
    to { width: 100%; }
}

@keyframes entryPulse {
    50% { opacity: .45; }
}

@keyframes entryCheck {
    from { opacity: 0; transform: scale(.5); }
    to { opacity: 1; transform: scale(1); }
}

@media(max-width:480px) {
    .entry-logo {
        top: 16px;
        left: 16px;
        width: 76px;
        height: 76px;
    }

    .entry-content h1 {
        letter-spacing: 2px;
    }
}

@media(prefers-reduced-motion:reduce) {
    .entry-logo,
    .entry-content,
    .entry-progress,
    .welcome-check {
        animation-duration: .01ms !important;
    }
}
</style>

<script>
/* SEQUÊNCIA DE ENTRADA */
(function iniciarEntradaBM3() {
    function iniciar() {
        const loading = document.getElementById("loading");
        const welcome = document.getElementById("welcome");
        const app = document.querySelector(".app");

        if (!loading || !welcome || !app) return;

        // Impede que o menu apareça atrás da tela inicial.
        app.classList.remove("ready");

        // 1. Exibe a logo e o carregamento.
        setTimeout(function() {
            loading.style.opacity = "0";
            loading.style.visibility = "hidden";

            // 2. Retira a logo e mostra as boas-vindas.
            setTimeout(function() {
                loading.style.display = "none";
                welcome.classList.add("show");

                // 3. Retira as boas-vindas e abre o menu.
                setTimeout(function() {
                    welcome.classList.remove("show");
                    welcome.classList.add("hide");

                    app.classList.add("ready");

                    setTimeout(function() {
                        welcome.style.display = "none";
                    }, 750);

                }, 2200);

            }, 750);

        }, 3000);
    }

    if (document.readyState === "loading") {
        document.addEventListener(
            "DOMContentLoaded", iniciar, { once: true }
        );
    } else {
        iniciar();
    }
})();
</script>
