
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍀 BOT DO BM3 🍀</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  min-height: 100vh;
  background: linear-gradient(135deg, #008C45, #FFFFFF, #CD212A);
}

#carregando {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #008C45, #FFFFFF, #CD212A);
}

.carregando-box {
  width: 90%;
  max-width: 350px;
  padding: 30px;
  text-align: center;
  background: white;
  border-radius: 20px;
  box-shadow: 0 8px 25px rgba(0,0,0,.2);
}

.spinner {
  width: 45px;
  height: 45px;
  margin: 15px auto;
  border: 5px solid #ddd;
  border-top: 5px solid #008C45;
  border-right: 5px solid #CD212A;
  border-radius: 50%;
  animation: girar 1s linear infinite;
}

@keyframes girar {
  to {
    transform: rotate(360deg);
  }
}

.container {
  max-width: 700px;
  margin: auto;
}

.topo {
  padding: 25px 15px;
  margin-bottom: 20px;
  text-align: center;
  border-radius: 18px;
  background: linear-gradient(90deg, #008C45, #FFFFFF, #CD212A);
  box-shadow: 0 5px 15px rgba(0,0,0,.15);
}

.bandeira {
  width: 100%;
  height: 6px;
  border-radius: 10px;
  background: linear-gradient(
    90deg,
    #008C45 33%,
    #FFFFFF 33%,
    #FFFFFF 66%,
    #CD212A 66%
  );
}

.topo h1 {
  margin: 12px 0 5px;
}

.topo p {
  margin: 0;
  font-weight: bold;
}

.inicio,
.menu,
.tela {
  background: white;
  border-radius: 18px;
  box-shadow: 0 5px 15px rgba(0,0,0,.15);
}

.inicio {
  padding: 25px;
  text-align: center;
}

.menu {
  display: none;
  padding: 15px;
}

.tela {
  display: none;
  padding: 20px;
}

button {
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-weight: bold;
}

.inicio button,
.menu button {
  width: 100%;
  padding: 14px;
  margin-bottom: 10px;
  color: white;
  font-size: 16px;
  background: linear-gradient(90deg, #008C45, #CD212A);
}

input,
textarea {
  width: 100%;
  padding: 12px;
  margin: 8px 0 12px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
}

.acao {
  width: 100%;
  padding: 13px;
  margin-top: 10px;
  color: white;
  font-size: 16px;
  background: #008C45;
}

.voltar {
  background: #555;
}

.contato {
  padding: 15px;
  margin-top: 12px;
  border: 1px solid #ddd;
  border-radius: 12px;
}

.status-box {
  padding: 12px;
  margin-top: 15px;
  border-radius: 10px;
  background: #f5f5f5;
}

.status-atual {
  margin-bottom: 10px;
  font-size: 18px;
  font-weight: bold;
}

.botao-alterar {
  width: 100%;
  padding: 12px;
  color: white;
  font-size: 15px;
  background: #555;
}

.opcoes-status {
  display: none;
  margin-top: 10px;
}

.opcoes-status button {
  display: block;
  width: 100%;
  padding: 12px;
  margin-top: 8px;
  color: white;
  font-size: 15px;
}

.status-analise {
  background: #d99a00;
}

.status-on {
  background: #008C45;
}

.status-caiu {
  background: #CD212A;
}

.whatsapp {
  background: #008C45;
}

.excluir {
  background: #CD212A;
}

.grupo-item {
  padding: 12px;
  margin-bottom: 8px;
  border-radius: 10px;
  background: #f2f2f2;
  font-weight: bold;
}
</style>
</head>

<body>

<div id="carregando">
  <div class="carregando-box">
    <h1>🍀 BOT DO BM3 🍀</h1>
    <div class="spinner"></div>
    <strong>⏳ Carregando...</strong>
  </div>
</div>

<div class="container">

  <div class="topo">
    <div class="bandeira"></div>
    <h1>🍀 BOT DO BM3 🍀</h1>
    <p>Organizador de contatos</p>
  </div>

  <div class="inicio" id="inicio">
    <h2>🏠 Início</h2>
    <p>Bem-vindo ao BOT DO BM3</p>

    <button id="botaoMenu">
      ☰ Abrir Menu
    </button>
  </div>

  <div class="menu" id="menu">

    <button data-tela="adicionar">
      ➕ Adicionar contato
    </button>

    <button data-tela="pesquisar">
      🔎 Pesquisar contatos
    </button>

    <button data-tela="contatos">
      📋 Meus contatos
    </button>

    <button data-tela="grupos">
      🏷️ Grupos / Etiquetas
    </button>

    <button data-tela="configuracoes">
      ⚙️ Configurações
    </button>

    <button id="botaoInicio">
      🏠 Voltar ao início
    </button>

  </div>

  <div class="tela" id="adicionar">

    <h2>➕ Adicionar contato</h2>

    <input id="nome" placeholder="Nome">

    <input id="numero" placeholder="Número do WhatsApp">

    <input id="grupo" placeholder="Grupo / Etiqueta">

    <textarea id="observacao" placeholder="Observação"></textarea>

    <button class="acao" id="salvarContato">
      💾 Salvar contato
    </button>

    <button class="acao voltar" data-voltar>
      ↩️ Voltar ao menu
    </button>

  </div>

  <div class="tela" id="pesquisar">

    <h2>🔎 Pesquisar contatos</h2>

    <input
      id="pesquisa"
      placeholder="Digite nome, número ou grupo..."
    >

    <div id="resultadoPesquisa"></div>

    <button class="acao voltar" data-voltar>
      ↩️ Voltar ao menu
    </button>

  </div>

  <div class="tela" id="contatos">

    <h2>📋 Meus contatos</h2>

    <div id="lista"></div>

    <button class="acao voltar" data-voltar>
      ↩️ Voltar ao menu
    </button>

  </div>

  <div class="tela" id="grupos">

    <h2>🏷️ Grupos / Etiquetas</h2>

    <div id="listaGrupos"></div>

    <button class="acao voltar" data-voltar>
      ↩️ Voltar ao menu
    </button>

  </div>

  <div class="tela" id="configuracoes">

    <h2>⚙️ Configurações</h2>

    <p><strong>🍀 BOT DO BM3 🍀</strong></p>

    <p>Organizador de contatos</p>

    <button class="acao" id="limparContatos">
      🗑️ Apagar todos os contatos
    </button>

    <button class="acao voltar" data-voltar>
      ↩️ Voltar ao menu
    </button>

  </div>

</div>

<script>

let contatos = [];

try {
  contatos = JSON.parse(
    localStorage.getItem("contatos") || "[]"
  );
} catch (erro) {
  contatos = [];
}

setTimeout(function() {
  document.getElementById("carregando").style.display = "none";
}, 2000);


function salvar() {
  localStorage.setItem(
    "contatos",
    JSON.stringify(contatos)
  );
}


function esconderTudo() {

  document.getElementById("inicio").style.display = "none";

  document.getElementById("menu").style.display = "none";

  document.querySelectorAll(".tela").forEach(function(tela) {
    tela.style.display = "none";
  });
}


function mostrarMenu() {

  esconderTudo();

  document.getElementById("menu").style.display = "block";
}


function mostrarInicio() {

  esconderTudo();

  document.getElementById("inicio").style.display = "block";
}


document.getElementById("botaoMenu").addEventListener(
  "click",
  mostrarMenu
);


document.getElementById("botaoInicio").addEventListener(
  "click",
  mostrarInicio
);


document.querySelectorAll("[data-tela]").forEach(function(botao) {

  botao.addEventListener("click", function() {

    const tela = botao.dataset.tela;

    esconderTudo();

    document.getElementById(tela).style.display = "block";

    if (tela === "contatos") {
      mostrarContatos();
    }

    if (tela === "pesquisar") {
      mostrarContatos();
    }

    if (tela === "grupos") {
      mostrarGrupos();
    }

  });

});


document.querySelectorAll("[data-voltar]").forEach(function(botao) {

  botao.addEventListener("click", mostrarMenu);

});


document.getElementById("salvarContato").addEventListener(
  "click",
  adicionarContato
);


function adicionarContato() {

  const nome =
    document.getElementById("nome").value.trim();

  const numero =
    document.getElementById("numero").value.trim();

  const grupo =
    document.getElementById("grupo").value.trim();

  const observacao =
    document.getElementById("observacao").value.trim();

  if (!nome || !numero) {

    alert(
      "Digite pelo menos o nome e o número."
    );

    return;
  }

  contatos.push({

    nome: nome,

    numero: numero,

    grupo: grupo,

    observacao: observacao,

    status: "⚠️ ZAP EM ANÁLISE",

    ultimaAtualizacao:
      new Date().toLocaleString("pt-BR")

  });

  salvar();

  document.getElementById("nome").value = "";
  document.getElementById("numero").value = "";
  document.getElementById("grupo").value = "";
  document.getElementById("observacao").value = "";

  alert("✅ Contato salvo com sucesso!");

  mostrarContatos();
}


function mostrarContatos() {

  const pesquisa =
    (
      document.getElementById("pesquisa")?.value || ""
    ).toLowerCase();

  let html = "";

  contatos.forEach(function(contato, index) {

    const texto =
      (
        contato.nome +
        " " +
        contato.numero +
        " " +
        contato.grupo
      ).toLowerCase();

    if (!texto.includes(pesquisa)) {
      return;
    }

    const status =
      contato.status ||
      "⚠️ ZAP EM ANÁLISE";

    const data =
      contato.ultimaAtualizacao ||
      "Não registrada";

    html += `

      <div class="contato">

        <strong>👤 ${contato.nome}</strong>

        <br><br>

        📱 Número:
        ${contato.numero}

        <br><br>

        🏷️ Grupo:
        ${contato.grupo || "Sem grupo"}

        <br><br>

        📝 Observação:
        ${contato.observacao || "Sem observação"}

        <div class="status-box">

          <div class="status-atual">
            Status atual: ${status}
          </div>

          <button
            class="botao-alterar"
            data-abrir-status="${index}"
          >
            🔽 Alterar status
          </button>

          <div
            class="opcoes-status"
            id="status-${index}"
          >

            <button
              class="status-analise"
              data-status-index="${index}"
              data-status="⚠️ ZAP EM ANÁLISE"
            >
              ⚠️ ZAP EM ANÁLISE
            </button>

            <button
              class="status-on"
              data-status-index="${index}"
              data-status="✅ ZAP ON"
            >
              ✅ ZAP ON
            </button>

            <button
              class="status-caiu"
              data-status-index="${index}"
              data-status="❌ ZAP CAIU"
            >
              ❌ ZAP CAIU
            </button>

          </div>

          <br>

          📅 Última atualização:
          ${data}

        </div>

        <button
          class="acao whatsapp"
          data-whatsapp="${contato.numero}"
        >
          💬 Abrir WhatsApp
        </button>

        <button
          class="acao excluir"
          data-excluir="${index}"
        >
          🗑️ Excluir
        </button>

      </div>

    `;
  });

  const resultado =
    html || "<p>Nenhum contato encontrado.</p>";

  document.getElementById("lista").innerHTML = resultado;

  document.getElementById("resultadoPesquisa").innerHTML = resultado;

  ativarBotoesContatos();
}


function ativarBotoesContatos() {

  document.querySelectorAll("[data-abrir-status]").forEach(
    function(botao) {

      botao.addEventListener("click", function() {

        const index =
          botao.dataset.abrirStatus;

        const opcoes =
          document.getElementById(
            "status-" + index
          );

        if (opcoes.style.display === "block") {

          opcoes.style.display = "none";

        } else {

          opcoes.style.display = "block";
        }

      });

    }
  );


  document.querySelectorAll("[data-status-index]").forEach(
    function(botao) {

      botao.addEventListener("click", function() {

        const index =
          Number(botao.dataset.statusIndex);

        const novoStatus =
          botao.dataset.status;

        contatos[index].status = novoStatus;

        contatos[index].ultimaAtualizacao =
          new Date().toLocaleString("pt-BR");

        salvar();

        mostrarContatos();

      });

    }
  );


  document.querySelectorAll("[data-excluir]").forEach(
    function(botao) {

      botao.addEventListener("click", function() {

        const index =
          Number(botao.dataset.excluir);

        if (confirm("Deseja excluir este contato?")) {

          contatos.splice(index, 1);

          salvar();

          mostrarContatos();

          mostrarGrupos();

        }

      });

    }
  );


  document.querySelectorAll("[data-whatsapp]").forEach(
    function(botao) {

      botao.addEventListener("click", function() {

        const numero =
          botao.dataset.whatsapp.replace(/\D/g, "");

        window.open(
          "https://wa.me/" + numero,
          "_blank"
        );

      });

    }
  );

}


document.getElementById("pesquisa").addEventListener(
  "input",
  mostrarContatos
);


function mostrarGrupos() {

  const lista =
    document.getElementById("listaGrupos");

  const grupos = {};

  contatos.forEach(function(contato) {

    const grupo =
      contato.grupo || "Sem grupo";

    if (!grupos[grupo]) {
      grupos[grupo] = 0;
    }

    grupos[grupo]++;

  });

  let html = "";

  Object.keys(grupos).forEach(function(grupo) {

    html += `

      <div class="grupo-item">
        🏷️ ${grupo} —
        ${grupos[grupo]} contato(s)
      </div>

    `;

  });

  lista.innerHTML =
    html ||
    "<p>Nenhum grupo cadastrado.</p>";
}


document.getElementById("limparContatos").addEventListener(
  "click",
  function() {

    if (
      confirm(
        "Tem certeza que deseja apagar TODOS os contatos?"
      )
    ) {

      contatos = [];

      salvar();

      mostrarContatos();

      mostrarGrupos();

      alert(
        "🗑️ Todos os contatos foram apagados."
      );

    }

  }
);

</script>

</body>
</html>
