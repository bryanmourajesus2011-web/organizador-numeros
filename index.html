<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🍀 BOT DO BM3 🍀</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #008C45, #FFFFFF, #CD212A);
      margin: 0;
      padding: 20px;
      min-height: 100vh;
    }

    /* CARREGAMENTO */

    #carregando {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #008C45, #FFFFFF, #CD212A);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .carregando-box {
      background: white;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      width: 90%;
      max-width: 350px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    }

    .carregando-box h1 {
      margin: 0 0 15px;
      font-size: 24px;
    }

    .spinner {
      width: 45px;
      height: 45px;
      border: 5px solid #ddd;
      border-top: 5px solid #008C45;
      border-right: 5px solid #CD212A;
      border-radius: 50%;
      margin: 15px auto;
      animation: girar 1s linear infinite;
    }

    @keyframes girar {
      100% {
        transform: rotate(360deg);
      }
    }

    /* SITE */

    .container {
      max-width: 700px;
      margin: auto;
    }

    .topo {
      text-align: center;
      padding: 25px 15px;
      margin-bottom: 20px;
      border-radius: 18px;
      background: linear-gradient(90deg, #008C45, #FFFFFF, #CD212A);
      box-shadow: 0 5px 15px rgba(0,0,0,0.15);
    }

    .bandeira {
      width: 100%;
      height: 6px;
      border-radius: 10px;
      background: linear-gradient(
        90deg,
        #008C45 33%,
        #FFFFFF 33%,
        #FFFFFF 66%,
        #CD212A 66%
      );
    }

    .topo h1 {
      margin: 12px 0 5px;
      font-size: 28px;
    }

    .topo p {
      margin: 0;
      font-weight: bold;
    }

    .inicio {
      background: white;
      padding: 25px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 5px 15px rgba(0,0,0,0.15);
    }

    .inicio button {
      background: linear-gradient(90deg, #008C45, #CD212A);
      color: white;
      font-weight: bold;
      border: none;
      padding: 15px;
      border-radius: 12px;
      width: 100%;
      font-size: 18px;
      cursor: pointer;
    }

    .menu {
      display: none;
      background: white;
      padding: 15px;
      border-radius: 18px;
      margin-bottom: 20px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.15);
    }

    .menu button {
      width: 100%;
      padding: 14px;
      margin-bottom: 10px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, #008C45, #CD212A);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .menu button:last-child {
      margin-bottom: 0;
    }

    .tela {
      display: none;
      background: white;
      padding: 20px;
      border-radius: 18px;
      margin-bottom: 20px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.15);
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    .acao {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 9px;
      background: #008C45;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .voltar {
      background: #555;
      margin-top: 10px;
    }

    .contato {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      margin-top: 10px;
    }

    .status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      background: #fff3cd;
      font-weight: bold;
    }

    .whatsapp {
      background: #008C45;
      margin-top: 12px;
    }

    .excluir {
      background: #CD212A;
      margin-top: 8px;
    }

    .grupo-item {
      padding: 12px;
      border-radius: 10px;
      background: #f2f2f2;
      margin-bottom: 8px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<!-- CARREGAMENTO -->

<div id="carregando">
  <div class="carregando-box">
    <h1>🍀 BOT DO BM3 🍀</h1>
    <div class="spinner"></div>
    <strong>⏳ Carregando...</strong>
  </div>
</div>

<div class="container">

  <div class="topo">
    <div class="bandeira"></div>
    <h1>🍀 BOT DO BM3 🍀</h1>
    <p>Organizador de contatos</p>
  </div>

  <!-- INÍCIO -->

  <div class="inicio" id="inicio">
    <h2>🏠 Início</h2>
    <p>Bem-vindo ao BOT DO BM3</p>

    <button onclick="abrirMenu()">
      ☰ Abrir Menu
    </button>
  </div>

  <!-- MENU -->

  <div class="menu" id="menu">

    <button onclick="abrirTela('adicionar')">
      ➕ Adicionar contato
    </button>

    <button onclick="abrirTela('pesquisar')">
      🔎 Pesquisar contatos
    </button>

    <button onclick="abrirTela('contatos')">
      📋 Meus contatos
    </button>

    <button onclick="abrirTela('grupos')">
      🏷️ Grupos / Etiquetas
    </button>

    <button onclick="abrirTela('configuracoes')">
      ⚙️ Configurações
    </button>

    <button onclick="voltarInicio()">
      🏠 Voltar ao início
    </button>

  </div>

  <!-- ADICIONAR -->

  <div class="tela" id="adicionar">

    <h2>➕ Adicionar contato</h2>

    <input id="nome" placeholder="Nome">

    <input id="numero" placeholder="Número do WhatsApp">

    <input id="grupo" placeholder="Grupo / Etiqueta">

    <textarea id="observacao" placeholder="Observação"></textarea>

    <button class="acao" onclick="adicionarContato()">
      💾 Salvar contato
    </button>

    <button class="acao voltar" onclick="voltarMenu()">
      ↩️ Voltar ao menu
    </button>

  </div>

  <!-- PESQUISAR -->

  <div class="tela" id="pesquisar">

    <h2>🔎 Pesquisar contatos</h2>

    <input
      id="pesquisa"
      placeholder="Digite nome, número ou grupo..."
      oninput="mostrarContatos()"
    >

    <div id="resultadoPesquisa"></div>

    <button class="acao voltar" onclick="voltarMenu()">
      ↩️ Voltar ao menu
    </button>

  </div>

  <!-- CONTATOS -->

  <div class="tela" id="contatos">

    <h2>📋 Meus contatos</h2>

    <div id="lista"></div>

    <button class="acao voltar" onclick="voltarMenu()">
      ↩️ Voltar ao menu
    </button>

  </div>

  <!-- GRUPOS -->

  <div class="tela" id="grupos">

    <h2>🏷️ Grupos / Etiquetas</h2>

    <div id="listaGrupos"></div>

    <button class="acao voltar" onclick="voltarMenu()">
      ↩️ Voltar ao menu
    </button>

  </div>

  <!-- CONFIGURAÇÕES -->

  <div class="tela" id="configuracoes">

    <h2>⚙️ Configurações</h2>

    <p><strong>🍀 BOT DO BM3 🍀</strong></p>

    <p>Organizador de contatos</p>

    <button class="acao" onclick="limparContatos()">
      🗑️ Apagar todos os contatos
    </button>

    <button class="acao voltar" onclick="voltarMenu()">
      ↩️ Voltar ao menu
    </button>

  </div>

</div>

<script>

let contatos = JSON.parse(
  localStorage.getItem("contatos") || "[]"
);

/* CARREGAMENTO DE 2 SEGUNDOS */

setTimeout(function() {

  document.getElementById("carregando").style.display = "none";

}, 2000);


/* SALVAR */

function salvar() {

  localStorage.setItem(
    "contatos",
    JSON.stringify(contatos)
  );

}


/* ABRIR MENU */

function abrirMenu() {

  document.getElementById("inicio").style.display = "none";

  esconderTelas();

  document.getElementById("menu").style.display = "block";

}


/* VOLTAR AO INÍCIO */

function voltarInicio() {

  esconderTelas();

  document.getElementById("menu").style.display = "none";

  document.getElementById("inicio").style.display = "block";

}


/* ABRIR TELA */

function abrirTela(tela) {

  document.getElementById("menu").style.display = "none";

  esconderTelas();

  document.getElementById(tela).style.display = "block";

  if (tela === "contatos") {
    mostrarContatos();
  }

  if (tela === "pesquisar") {
    mostrarContatos();
  }

  if (tela === "grupos") {
    mostrarGrupos();
  }

}


/* VOLTAR AO MENU */

function voltarMenu() {

  esconderTelas();

  document.getElementById("menu").style.display = "block";

}


/* ESCONDER TELAS */

function esconderTelas() {

  const telas = document.querySelectorAll(".tela");

  telas.forEach(function(tela) {

    tela.style.display = "none";

  });

}


/* ADICIONAR CONTATO */

function adicionarContato() {

  const nome =
    document.getElementById("nome").value.trim();

  const numero =
    document.getElementById("numero").value.trim();

  const grupo =
    document.getElementById("grupo").value.trim();

  const observacao =
    document.getElementById("observacao").value.trim();


  if (!nome || !numero) {

    alert("Digite pelo menos o nome e o número.");

    return;

  }


  contatos.push({

    nome: nome,

    numero: numero,

    grupo: grupo,

    observacao: observacao,

    status: "⚠️ ZAP EM ANÁLISE",

    ultimaAtualizacao:
      new Date().toLocaleString("pt-BR")

  });


  salvar();


  document.getElementById("nome").value = "";

  document.getElementById("numero").value = "";

  document.getElementById("grupo").value = "";

  document.getElementById("observacao").value = "";


  alert("✅ Contato salvo com sucesso!");


  mostrarContatos();

}


/* EXCLUIR */

function excluirContato(index) {

  if (confirm("Deseja excluir este contato?")) {

    contatos.splice(index, 1);

    salvar();

    mostrarContatos();

    mostrarGrupos();

  }

}


/* MOSTRAR CONTATOS */

function mostrarContatos() {

  const lista =
    document.getElementById("lista");

  const resultado =
    document.getElementById("resultadoPesquisa");

  const pesquisaElemento =
    document.getElementById("pesquisa");

  const pesquisa =
    pesquisaElemento
      ? pesquisaElemento.value.toLowerCase()
      : "";


  let html = "";


  contatos.forEach(function(contato, index) {

    const texto =
      `${contato.nome} ${contato.numero} ${contato.grupo}`
      .toLowerCase();


    if (!texto.includes(pesquisa)) {

      return;

    }


    html += `

      <div class="contato">

        <strong>👤 ${contato.nome}</strong>

        <br><br>

        📱 Número: ${contato.numero}

        <br>

        🏷️ Grupo: ${contato.grupo || "Sem grupo"}

        <br>

        📝 Observação:
        ${contato.observacao || "Sem observação"}

        <div class="status">

          ${contato.status || "⚠️ ZAP EM ANÁLISE"}

          <br>

          📅 Última atualização:
          ${contato.ultimaAtualizacao || "Não registrada"}

        </div>


        <button
          class="acao whatsapp"
          onclick="abrirWhatsApp('${contato.numero}')">

          💬 Abrir WhatsApp

        </button>


        <button
          class="acao excluir"
          onclick="excluirContato(${index})">

          🗑️ Excluir

        </button>

      </div>

    `;

  });


  if (lista) {

    lista.innerHTML =
      html || "<p>Nenhum contato encontrado.</p>";

  }


  if (resultado) {

    resultado.innerHTML =
      html || "<p>Nenhum contato encontrado.</p>";

  }

}


/* WHATSAPP */

function abrirWhatsApp(numero) {

  const numeroLimpo =
    numero.replace(/\D/g, "");

  window.open(
    "https://wa.me/" + numeroLimpo,
    "_blank"
  );

}


/* GRUPOS */

function mostrarGrupos() {

  const lista =
    document.getElementById("listaGrupos");

  const grupos = {};


  contatos.forEach(function(contato) {

    const grupo =
      contato.grupo || "Sem grupo";


    if (!grupos[grupo]) {

      grupos[grupo] = 0;

    }


    grupos[grupo]++;

  });


  let html = "";


  Object.keys(grupos).forEach(function(grupo) {

    html += `

      <div class="grupo-item">

        🏷️ ${grupo} — ${grupos[grupo]} contato(s)

      </div>

    `;

  });


  lista.innerHTML =
    html || "<p>Nenhum grupo cadastrado.</p>";

}


/* APAGAR TODOS */

function limparContatos() {

  if (
    confirm(
      "Tem certeza que deseja apagar TODOS os contatos?"
    )
  ) {

    contatos = [];

    salvar();

    mostrarContatos();

    mostrarGrupos();

    alert(
      "🗑️ Todos os contatos foram apagados."
    );

  }

}

</script>

</body>
</html>
